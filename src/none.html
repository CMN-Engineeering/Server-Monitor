<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1 style = "font-weight : bold">DevTool Detected! Close to continue!</h1>
</body>
<script>
    function detectDevTool() {
        const data = Array.from({ length: 5000 }, (_, i) => ({
            index: i,
            value: Math.random()
        }));

        const start1 = performance.now();
        console.log(data);
        const logTime = performance.now() - start1;

        const start2 = performance.now();
        console.table(data);
        const tableTime = performance.now() - start2;

        console.clear();

        console.log("log:", logTime);
        console.log("table:", tableTime);

        // Threshold depends on browser/device
        if (tableTime - logTime > 10) {
            console.warn("DevTools may be open");
            return true;
        }

        return false;
    }
    function returnMain(){
        if(!detectDevTool()){
            window.location.href = "index.html";
        }
    }
    setInterval(returnMain,200);
</script>
</html>
